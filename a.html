<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kirchhoff's Laws - Interactive Lab</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:14px;text-align:center;color:#222}
  h2{margin:6px 0} h3{margin:18px 0 4px}
  canvas{background:#fff;border:2px solid #345;border-radius:8px;display:block;margin:8px auto;max-width:100%}
  .panel{display:inline-block;vertical-align:top;background:#fff;border:1px solid #bbb;border-radius:8px;padding:10px 14px;margin:6px;text-align:left;font-size:14px}
  .panel label{display:block;margin:4px 0}
  .panel input[type=range]{width:170px;vertical-align:middle}
  .panel input[type=number]{width:70px}
  button{padding:6px 12px;margin:4px 2px;border:0;border-radius:5px;background:#2a6fdb;color:#fff;cursor:pointer;font-size:14px}
  button.alt{background:#777}
  .ok{color:#0a7a2f;font-weight:bold}.bad{color:#c00;font-weight:bold}
  .sol{background:#fffbe6;border:1px solid #e6d98a;border-radius:6px;padding:8px;margin-top:8px;font-size:13px;line-height:1.5}
  .note{max-width:800px;margin:0 auto;font-size:14px}
</style>
</head>
<body>
<h2>Kirchhoff's Laws: Interactive Lab</h2>
<div class="note">Change the values, <b>predict first</b>, then check. Moving dots show conventional current; faster dots mean more current (speed is capped for very large currents).</div>
<div><button id="pp">Pause</button></div>

<!-- ============ KCL ============ -->
<h3>1. KCL: Parallel Circuit</h3>
<canvas id="c1" width="800" height="400"></canvas>
<div class="panel" id="k_ctrl"></div>
<div class="panel">
  <b>Predict the currents (in A)</b>
  <label>I1 (through R1): <input type="number" id="k_i1" step="any"> <span id="k_f1"></span></label>
  <label>I2 (through R2): <input type="number" id="k_i2" step="any"> <span id="k_f2"></span></label>
  <label>I3 (through R3): <input type="number" id="k_i3" step="any"> <span id="k_f3"></span></label>
  <label>Total source current I: <input type="number" id="k_it" step="any"> <span id="k_ft"></span></label>
  <button onclick="checkK()">Check my prediction</button>
  <button class="alt" onclick="showK()">Show answer and values</button>
  <button class="alt" onclick="randK()">New random problem</button>
  <div id="k_sol"></div>
</div>

<!-- ============ KVL ============ -->
<h3>2. KVL: Series Loop</h3>
<canvas id="c2" width="800" height="400"></canvas>
<div class="panel" id="v_ctrl"></div>
<div class="panel">
  <b>Predict the loop (A and V)</b>
  <label>Loop current I (A): <input type="number" id="v_i" step="any"> <span id="v_f0"></span></label>
