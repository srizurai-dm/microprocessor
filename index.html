<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>8085 - 8255 Interfacing (Mode 0)</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:12px;text-align:center;color:#222}
canvas{background:#fff;border:2px solid #345;border-radius:8px;display:block;margin:8px auto;max-width:100%}
.p{display:inline-block;vertical-align:top;background:#fff;border:1px solid #bbb;border-radius:8px;padding:8px 12px;margin:4px;text-align:left;font-size:14px}
button{padding:6px 11px;margin:2px;border:0;border-radius:5px;background:#2a6fdb;color:#fff;cursor:pointer}
button.r{background:#c0392b} button.g{background:#1a7f37} button.o{background:#d98200}
input[type=text]{width:50px;font-family:monospace;text-transform:uppercase}
#ex{max-width:1060px;margin:6px auto;text-align:left;background:#fffbe6;border:1px solid #e6d98a;border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.5;min-height:46px}
</style></head><body>
<h2>Interfacing 8085 with 8255: Mode 0, all ports as outputs</h2>
<div class="p">
 <b>Step 1:</b> <button class="g" onclick="queue=[];send('cw',0x80)">OUT 03H: control word 80H</button>
 <button class="r" onclick="queue=[];resetChip()">RESET 8255</button>
 <button class="o" onclick="runDemo()">&#9654; Run demo</button><br>
 <b>Step 2:</b> Write to:
 <select id="sel"><option value="A">Port A (00H)</option><option value="B">Port B (01H)</option>
  <option value="C">Port C (02H)</option><option value="cw">Control register (03H)</option></select>
 Data (hex): <input type="text" id="dat" value="A5" maxlength="2">
 <button onclick="queue=[];send(document.getElementById('sel').value,parseInt(document.getElementById('dat').value,16)||0)">MVI A,data + OUT</button>
 Speed: <input type="range" id="sp" min="0.3" max="2" step="0.1" value="0.7">
</div>
<canvas id="cv" width="1100" height="540"></canvas>
<div id="ex"></div>
<script>
const g=document.getElementById('cv').getContext('2d');
const h2=v=>(v&255).toString(16).toUpperCase().padStart(2,'0')+'H';
const C={a:'#1f5fbf',d:'#1a9a4a',c:'#d03a2a'};
const PORTS={A:{y:130,pins:[37,38,39,40,1,2,3,4],nm:'PA',ad:0},B:{y:260,pins:[25,24,23,22,21,20,19,18],nm:'PB',ad:1},C:{y:390,pins:[10,11,12,13,17,16,15,14],nm:'PC',ad:2}};
let st,pend=null,F=[],t=9,tm=0,queue=[],msg='',last=performance.now();
function resetChip(){st={out:{A:0,B:0,C:0},inA:true,inB:true,inCu:true,inCl:true,cw:null};pend=null;F=[];t=9;
 msg='<b>RESET:</b> RESET OUT (pin 3) of the 8085 drives RESET (pin 35) of the 8255. All ports become <b>input</b> and the LEDs stay off. Write control word 80H to select Mode 0 with all ports as outputs.';}
function runDemo(){resetChip();queue=[['A',0x55],['B',0xAA],['C',0xFF]];send('cw',0x80);}
function isOut(p,bit){return p==='A'?!st.inA:p==='B'?!st.inB:(bit>=4?!st.inCu:!st.inCl);}
function send(sel,val){
 pend={sel,val,done:false};t=0;
 const ad=sel==='cw'?3:PORTS[sel].ad;pend.ad=ad;
 F=[{k:'a',p:[[200,190],[590,190]],a:0,b:3},
  {k:'a',p:[[200,130],[300,130],[300,240],[320,240]],a:0,b:1},
  {k:'c',p:[[200,290],[370,290],[370,285]],a:0,b:1},
  {k:'a',p:[[420,225],[590,225]],a:0.4,b:3},{k:'a',p:[[420,265],[590,265]],a:0.4,b:3},
  {k:'d',p:[[200,130],[590,130]],a:1,b:3},{k:'c',p:[[200,340],[590,340]],a:1,b:3}];
 if(sel!=='cw')F.push({k:'d',p:[[790,PORTS[sel].y],[840,PORTS[sel].y]],a:3,b:4});
}
function commit(){
 const {sel,val}=pend;
 if(sel==='cw'){
  if(val&0x80){st.cw=val;st.inA=!!(val&16);st.inB=!!(val&2);st.inCu=!!(val&8);st.inCl=!!(val&1);st.out={A:0,B:0,C:0};}
  else msg='Bit D7 = 0: this is a Bit Set/Reset (BSR) word for Port C, not used in this demo.';
 }else st.out[sel]=val;
}
function expl(cur){
 if(!pend)return msg;
 const o=pend,A=o.ad,s=o.sel==='cw'?'control register':'Port '+o.sel;
 if(t>=3){
  if(o.sel==='cw')return '<b>Control word '+h2(o.val)+' ('+o.val.toString(2).padStart(8,'0')+'b):</b> D7 = 1 means I/O mode, D6 D5 = 00 and D2 = 0 mean Mode 0. D4 / D1 / D3 / D0 = '+[o.val>>4&1,o.val>>1&1,o.val>>3&1,o.val&1].join(' / ')+' sets Port A / Port B / Port C upper / Port C lower (0 = output, 1 = input).';
  return isOut(o.sel,7)?'<b>Output:</b> '+h2(o.val)+' ('+o.val.toString(2).padStart(8,'0')+'b) is latched in the '+s+' and driven on its pins. A lit LED means that bit is 1.':'<b>Port is in INPUT mode:</b> its pins are not driven, so the LEDs stay off. Write control word 80H first.';}
 if(cur===0)return '<b>T1 \u2013 Address:</b> The instruction OUT '+h2(A)+' puts '+h2(A)+' on A15\u2013A8 and AD7\u2013AD0. A15 = 0 enables CS\u0305 (pin 6). ALE = 1, so the 74LS373 latches AD1 AD0 = '+(A>>1&1)+(A&1)+' and drives A1 (pin 8) and A0 (pin 9) to select the '+s+'.';
 if(cur===1)return '<b>T2 \u2013 Data and WR\u0305:</b> ALE = 0. The accumulator value '+h2(o.val)+' goes on AD7\u2013AD0 and reaches D7\u2013D0 (pins 27\u201334) of the 8255. WR\u0305 (pin 31 \u2192 pin 36) goes low.';
 return '<b>T3 \u2013 Write complete:</b> WR\u0305 returns high and the 8255 latches '+h2(o.val)+' in the '+s+'.';
}
function L(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s;}
function at(p,s){for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
 if(s<=d){const u=s/d;return[p[i-1][0]+u*(p[i][0]-p[i-1][0]),p[i-1][1]+u*(p[i][1]-p[i-1][1])];}s-=d;}return p[p.length-1];}
function ln(p,w,c,al){g.globalAlpha=al||1;g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.beginPath();
 p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();g.globalAlpha=1;}
function tx(s,x,y,c,z,al,b){g.font=(b?'bold ':'')+(z||11)+'px Arial';g.fillStyle=c||'#222';g.textAlign=al||'left';g.fillText(s,x,y);}
function pill(x,y,s,c){g.font='bold 12px monospace';const w=g.measureText(s).width+10;
 g.fillStyle='#fff';g.strokeStyle=c;g.lineWidth=1.5;g.fillRect(x-w/2,y-9,w,18);g.strokeRect(x-w/2,y-9,w,18);
 g.fillStyle=c;g.textAlign='center';g.fillText(s,x,y+4);}
function bx(x,y,w,h,s,lit){g.fillStyle=lit?'#fff3b0':'#fff';g.strokeStyle=lit?'#e08a00':'#556';g.lineWidth=lit?3:1.5;
 g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);tx(s,x+w/2,y+h/2+4,'#123',12,'center');}
const on=f=>pend&&t>=f.a&&t<f.b;

function draw(){
 g.clearRect(0,0,1100,540);
 const cur=Math.min(2,Math.floor(Math.min(t,2.999)));
 ['T1','T2','T3','LED'].forEach((s,i)=>{const hl=pend&&t<4&&Math.floor(Math.min(t,3.999))===i;
  g.fillStyle=hl?'#2a6fdb':'#dde3ec';g.fillRect(260+i*64,10,56,24);tx(s,288+i*64,27,hl?'#fff':'#333',13,'center');});
 const m0=st.cw!==null&&(st.cw&0x80)&&!(st.cw&0x64);
 tx(m0?'8255 Mode 0 (basic I/O), control word = '+h2(st.cw):'8255 mode: not set yet (after RESET all ports are inputs)',560,27,m0?'#1a7f37':'#b35900',14,'left',1);
 const base=[[[200,130],[590,130]],[[200,190],[590,190]],[[300,130],[300,240],[320,240]],[[200,290],[370,290],[370,285]],
  [[420,225],[590,225]],[[420,265],[590,265]],[[200,340],[590,340]],[[200,390],[590,390]],[[200,440],[590,440]]];
 base.forEach((p,i)=>ln(p,i===0?7:3,'#d3d9e2'));
 g.fillStyle='#eef2f7';g.strokeStyle='#345';g.lineWidth=3;g.fillRect(20,70,180,430);g.strokeRect(20,70,180,430);
 tx('8085',110,62,'#123',16,'center',1);
 [['AD0\u2013AD7 (pins 12\u201319)',134],['A15 (pin 28)',194],['(A8\u2013A15: pins 21\u201328)',208],['ALE (pin 30)',294],['WR\u0305 (pin 31)',344],['RD\u0305 (pin 32)',394],['RESET OUT (pin 3)',444]].forEach(a=>tx(a[0],194,a[1],'#123',11,'right'));
 tx('IO/M\u0305 (pin 34): not used here',194,420,'#888',10,'right');
 bx(30,458,160,32,'Accumulator A = '+(pend?h2(pend.val):'--'),pend&&t<2);
 tx('OUT '+(pend?h2(pend.ad):'port'),110,95,'#8a4b00',13,'center',1);
 bx(320,205,100,80,'74LS373',pend&&t<1);tx('latch',370,238,'#555',11,'center');tx('G = ALE',370,300,C.c,11,'center');
 g.fillStyle='#f6f1e7';g.strokeStyle='#345';g.lineWidth=3;g.fillRect(590,70,200,430);g.strokeRect(590,70,200,430);
 tx('8255 PPI',690,62,'#123',16,'center',1);
 [['D0\u2013D7',124],['pins 34\u201327',138],['CS\u0305 (pin 6)',194],['A0 (pin 9)',229],['A1 (pin 8)',269],['WR\u0305 (pin 36)',344],['RD\u0305 (pin 5)',394],['RESET (pin 35)',444]].forEach(a=>tx(a[0],596,a[1],'#123',11));
 const sel=pend&&pend.sel;
 [['A','Port A reg',105],['B','Port B reg',235],['C','Port C reg',365]].forEach(e=>bx(690,e[2],90,50,e[1],sel===e[0]&&t>=2));
 bx(690,455,90,32,'Control Reg',sel==='cw'&&t>=2);
 tx('RESET OUT \u2192 RESET (sets input mode)',400,432,'#777',11,'center');
 Object.keys(PORTS).forEach(k=>{const P=PORTS[k],y=P.y;ln([[790,y],[840,y]],7,'#d3d9e2');
  const mode=k==='C'?'upper '+(st.inCu?'INPUT':'OUTPUT')+' / lower '+(st.inCl?'INPUT':'OUTPUT'):(k==='A'?st.inA:st.inB)?'INPUT':'OUTPUT';
  tx('PORT '+k+' ('+h2(P.ad)+') \u2013 '+mode,840,y-26,'#123',12,'left',1);
  for(let i=7;i>=0;i--){const x=850+(7-i)*28,lit=isOut(k,i)&&(st.out[k]>>i&1);
   g.fillStyle=lit?'#ff2a2a':'#5a5a5a';g.strokeStyle='#222';g.lineWidth=1.5;g.beginPath();g.arc(x,y,10,0,7);g.fill();g.stroke();
   if(lit){g.fillStyle='rgba(255,60,60,0.25)';g.beginPath();g.arc(x,y,17,0,7);g.fill();}
   tx(P.nm+i,x,y+25,'#333',9,'center');tx('pin '+P.pins[7-i],x,y+36,'#1f5fbf',9,'center');}
  tx('LEDs with resistors to GND',840,y+52,'#777',10);});
 F.forEach(f=>{if(!on(f))return;ln(f.p,7,C[f.k],0.35);const l=L(f.p),n=Math.max(2,Math.floor(l/26));g.fillStyle=C[f.k];
  for(let i=0;i<n;i++){const q=at(f.p,(tm*90+i*l/n)%l);g.beginPath();g.arc(q[0],q[1],5,0,7);g.fill();}});
 const A=pend?pend.ad:0;
 pill(470,130,pend&&t>=1&&t<3?h2(pend.val):'--',C.d);
 pill(470,190,'A15 = 0',C.a);
 pill(500,225,'A0 = '+(pend&&t>=0.4&&t<3?(A&1):'-'),C.a);pill(500,265,'A1 = '+(pend&&t>=0.4&&t<3?(A>>1&1):'-'),C.a);
 pill(260,290,'ALE = '+(pend&&t<1?1:0),C.c);
 pill(470,340,'WR\u0305 = '+(pend&&t>=1&&t<3?0:1),C.c);pill(470,390,'RD\u0305 = 1',C.c);
 [['Address flow',C.a],['Data flow',C.d],['Control flow',C.c]].forEach((e,i)=>{g.fillStyle=e[1];g.beginPath();g.arc(260+i*170,520,6,0,7);g.fill();tx(e[0],272+i*170,525,'#222',13);});
 document.getElementById('ex').innerHTML=expl(cur);
}
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;tm+=dt;
 if(pend&&t<4){t+=dt*parseFloat(document.getElementById('sp').value);
  if(t>=3&&!pend.done){pend.done=true;commit();}
  if(t>=4&&queue.length){const q=queue.shift();send(q[0],q[1]);}}
 draw();requestAnimationFrame(frame);}
resetChip();requestAnimationFrame(frame);
</script></body></html>
