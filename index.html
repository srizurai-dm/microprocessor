=0xFFFF,F={S:0,Z:0,AC:0,P:0,CY:0},hlt=1,LM={},LS=[],W=new Set(),SV={},steps=0,lw='-',tm=null;\nconst x2=v=>(v&255).toString(16).toUpperCase().padStart(2,'0'),x4=v=>(v&65535).toString(16).toUpperCase().padStart(4,'0'),hv=s=>parseInt(String(s).trim().replace(/H$/i,''),16)||0;\nconst HL=()=>R[4]<<8|R[5],gr=i=>i==6?M[HL()]:R[i],par=v=>{let c=0;for(;v;v>>=1)c+=v&1;return +(c%2==0)};\nfunction wm(a,v){a&=65535;M[a]=v&255;W.add(a);lw=x4(a)+'H = '+x2(v)+'H ('+(v&255)+')'}\nconst sr=(i,v)=>i==6?wm(HL(),v):R[i]=v&255,rp=i=>i<3?R[2*i]<<8|R[2*i+1]:SP;\nfunction srp(i,v){v&=65535;if(i<3){R[2*i]=v>>8;R[2*i+1]=v&255}else SP=v}\nfunction szp(r){F.S=r>>7;F.Z=+(r==0);F.P=par(r)}\nfunction alu(t,v){const a=R[7];let r,c=t<4&&t&1?F.CY:0;\n if(t<2){r=a+v+c;F.AC=+((a&15)+(v&15)+c>15);F.CY=+(r>255)}\n else if(t<4||t==7){r=a-v-c;F.AC=+((a&15)+(~v&15)+1-c>15);F.CY=+(a<v+c)}\n else{r=t==4?a&v:t==5?a^v:a|v;F.CY=0;F.AC=+(t==4)}\n r&=255;szp(r);if(t!=7)R[7]=r}\nconst f8=()=>{const v=M[PC];PC=PC+1&65535;return v},f16=()=>{const l=f8();return f8()<<8|l};\nfunction ex(op){const d=op>>3&7,s=op&7,i=op>>4&3;\n if(op==0x76){hlt=1;return}if(!op)return;\n if((op&0xC0)==0x40)return sr(d,gr(s));if((op&0xC7)==6)return sr(d,f8());\n if((op&0xC7)==4){const v=gr(d),r=v+1&255;F.AC=+((v&15)+1>15);szp(r);return sr(d,r)}\n if((op&0xC7)==5){const v=gr(d),r=v-1&255;F.AC=+((v&15)>0);szp(r);return sr(d,r)}\n if((op&0xC0)==0x80)return alu(d,gr(s));if((op&0xC7)==0xC6)return alu(d,f8());\n if((op&0xCF)==1)return srp(i,f16());if((op&0xCF)==3)return srp(i,rp(i)+1);if((op&0xCF)==11)return srp(i,rp(i)-1);\n if((op&0xCF)==9){const r=HL()+rp(i);F.CY=+(r>65535);return srp(2,r)}\n if((op&0xC7)==0xC2){const a=f16();if([!F.Z,F.Z,!F.CY,F.CY,!F.P,F.P,!F.S,F.S][d])PC=a;return}\n if((op&0xEF)==10){R[7]=M[rp(i)];return}if((op&0xEF)==2)return wm(rp(i),R[7]);\n switch(op){case 0xC3:PC=f16();return;case 0x3A:R[7]=M[f16()];return;case 0x32:return wm(f16(),R[7]);\n case 0xEB:[R[2],R[4]]=[R[4],R[2]];[R[3],R[5]]=[R[5],R[3]];return;case 0x2F:R 'db').value);if(Math.abs(org-db)<256)throw'Program memory and data memory areas overlap: keep the start addresses at least 100H apart';\n const it=[],lab={};let a=org;\n $('src').value.split('\\n').forEach((raw,n)=>{let s=raw.split(';')[0].trim();if(!s)return;const q=s.match(/^([A-Za-z_]\\w*):\\s*(.*)$/);if(q){lab[q[1].toUpperCase()]=a;s=q[2].trim();if(!s)return}\n const p=s.split(/\\s+/),mn=p[0].toUpperCase(),o=p.slice(1).join('').toUpperCase().split(',').filter(x=>x);\n if(!MN[mn])throw'Line '+(n+1)+': Unknown instruction \"'+p[0]+'\"';if(o.length!=MN[mn][3])throw'Line '+(n+1)+': '+mn+' needs '+MN[mn][3]+' operand(s)';\n it.push({n:n+1,mn,o,a,t:mn+(o.length?' '+o.join(','):'')});a+=MN[mn][2]});\n if(!it.length)throw'No instructions found';if(a-org>256)throw'Program is larger than 256 bytes of program memory';\n LS=[];LM={};it.forEach(x=>{let b;try{b=enc(x.mn,x.o,lab)}catch(e){throw'Line '+x.n+': '+e}\n  x.b=b.map(x2).join(' ');LS.push(x);LM[x.a]=x;b.forEach((v,i)=>M[x.a+i]=v)});\n for(let i=a;i<org+256;i++)M[i]=0;reset();err('Assembled OK: '+(a-org)+' bytes at '+x4(org)+'H-'+x4(a-1)+'H. Press Run or Execute.',1)}catch(e){err(e)}draw()}\nfunction reset(){R.fill(0);F={S:0,Z:0,AC:0,P:0,CY:0};PC=hv($('org').value);SP=0xFFFF;steps=0;lw='-';W.clear();hlt=LS.length?0:1}\nfunction step(){if(hlt){if(!LS.length)err('Assemble a program first.');return}SV=snap();const a=PC,op=M[PC];PC=PC+1&65535;steps++;ex(op);if(steps>100000){hlt=1;err('Stopped: possible infinite loop (100000 instructions)')}}\nconst snap=()=>({R:R.join(),F:JSON.stringify(F),PC,SP});\nfunction run(){stop();if(hlt)reset();W.clear();const d=+$('spd').value;\n if(!d){let n=0;while(!hlt&&n++<100000)step();draw()}else tm=setInterval(()=>{step();draw();if(hlt)stop()},d)}\nfunction stop(){clearInterval(tm);tm=null}\nfunction smp(){const s=SMP[$('smp').selectedIndex];$('src').value=s[0];$('db').value='3000H';M.fill(0,0x3000,0x3100);s[1].forEach((v,i)=>M[0x3000+i]=v);asm()}\nfunction addD(){const a=hv($('aa').value),db=hv($('db').value);if(a<db||a>=db+128){err('Address must be inside the data memory window '+x4(db)+'H-'+x4(db+127)+'H');return}M[a]=hv($('av').value);err('Added '+x2(hv($('av').value))+'H at '+x4(a)+'H',1);draw()}\nfunction draw(){const sv=SV;\n $('rg').innerHTML=[...'ABCDEHL'].map(n=>{const i=RN.indexOf(n);return`<div class=\"r\">${n}<br><input id=\"r${n}\" value=\"${x2(R[i])}\" onchange=\"R[${i}]=hv(this.value)&255;draw()\"><br>${R[i]}<\/div>`}).join('')+\n `<div class=\"r\">PC<br><input id=\"rPC\" value=\"${x4(PC)}\" onchange=\"PC=hv(this.value)&65535;draw()\"><br>${PC}<\/div><div class=\"r\">SP<br><input value=\"${x4(SP)}\" onchange=\"SP=hv(this.value)&65535;draw()\"><br>${SP}<\/div><div class=\"r\">M<br><input value=\"${x2(M[HL()])}\" readonly><br>HL=${x4(HL())}<\/div>`;\n $('fl').innerHTML=Object.keys(F).map(k=>`<span class=\"f ${F[k]?'on':''}\" onclick=\"F['${k}']^=1;draw()\">${k}<br>${F[k]}<\/span>`).join('');\n $('res').innerHTML=`Accumulator A = ${x2(R[7])}H = ${R[7]} (decimal)<br>Last memory store: ${lw}<br>Instructions executed: ${steps}<br>Status: ${hlt?(steps?'Program finished (HLT)':'Not started'):'Ready / running'}`;\n $('lst').innerHTML='<tr><th>Address<\/th><th>Hex code<\/th><th>Instruction<\/th><\/tr>'+LS.map(x=>`<tr class=\"${x.a==PC?'cur':''}\"><td>${x4(x.a)}H<\/td><td>${x.b}<\/td><td style=\"text-align:left\">${x.t}<\/td><\/tr>`).join('');\n const org=hv($('org').value),db=hv($('db').value);\n let h='<table><tr><th>Addr<\/th>'+[...Array(16).keys()].map(i=>'<th>'+i.toString(16).toUpperCase()+'<\/th>').join('')+'<\/tr>';\n for(let r=0;r<8;r++){h+='<tr><th>'+x4(org+r*16)+'<\/th>';for(let c=0;c<16;c++){const a=org+r*16+c;h+=`<td class=\"${a==PC?'pc':''}\">${x2(M[a])}<\/td>`}h+='<\/tr>'}$('pm').innerHTML=h+'<\/table>';\n h='<table><tr><th>Addr<\/th>'+[...Array(16).keys()].map(i=>'<th>'+i.toString(16).toUpperCase()+'<\/th>').join('')+'<\/tr>';\n for(let r=0;r<8;r++){h+='<tr><th>'+x4(db+r*16)+'<\/th>';for(let c=0;c<16;c++){const a=db+r*16+c;h+=`<td> r:1px solid #b5d0f5;border-radius:8px;padding:8px 12px;min-height:40px;font-size:15px\"><\/div>\n<\/div><\/div>\n<script>\nconst S={A:0,B:0,C:0,D:0,E:0,H:0,L:0,PC:0x2000,SP:0x2FFF,IR:0,W:0,Z:0,TMP:0,fl:{S:0,Z:0,AC:0,P:0,CY:0}};\nconst R={\n A:{n:'A (Accumulator)',b:8,c:'acc',g:'g1',d:'Holds one operand and the result of most arithmetic/logic operations. Data to and from I/O ports also moves through A.'},\n B:{n:'B',b:8,c:'gp',d:'General purpose 8-bit register. Pairs with C to form the 16-bit register pair BC.'},\n C:{n:'C',b:8,c:'gp',d:'General purpose 8-bit register. Low half of the BC pair; also used as counter.'},\n D:{n:'D',b:8,c:'gp',d:'General purpose 8-bit register. Pairs with E to form DE.'},\n E:{n:'E',b:8,c:'gp',d:'General purpose 8-bit register. Low half of the DE pair.'},\n H:{n:'H',b:8,c:'gp',d:'General purpose 8-bit register. High half of HL; HL also acts as the memory pointer M.'},\n L:{n:'L',b:8,c:'gp',d:'General purpose 8-bit register. Low half of HL, the memory pointer M.'},\n F:{n:'F (Flag register)',b:8,c:'flg',g:'g3',d:'8-bit register but only 5 bits are used as flags: S, Z, AC, P, CY. The flags show the result of ALU operations.'},\n PC:{n:'PC (Program Counter)',b:16,c:'sp',g:'g4',d:'16-bit register holding the address of the next instruction. It can address 2^16 = 64K memory locations.'},\n SP:{n:'SP (Stack Pointer)',b:16,c:'sp',g:'g4',d:'16-bit register holding the address of the top of the stack (stack is in RAM).'},\n IR:{n:'IR (Instruction Register)',b:8,c:'in',g:'g5',d:'8-bit register that holds the opcode being decoded. Not accessible to the programmer.'},\n W:{n:'W (Temporary)',b:8,c:'in',g:'g5',d:'8-bit temporary register used internally with Z (e.g. CALL, XCHG). Not accessible.'},\n Z:{n:'Z (Temporary)',b:8,c:'in',g:'g5',d:'8-bit temporary register used internally with W. Not accessible.'},\n TMP:{n:'TEMP (ALU temp)',b:8,c:'in',g:'g5',d:'8-bit register that holds the second ALU operand during an operation. Not accessible.'}};\nconst hx=(v,b)=>v.toString(16).toUpperCase().padStart(b/4,'0')+'H';\nconst val=k=>k==='F'?(S.fl.S<<7|S.fl.Z<<6|S.fl.AC<<4|S.fl.P<<2|S.fl.CY):S[k];\n\nfunction mk(k){\n const r=R[k],el=document.createElement('div');el.className='reg '+r.c+(k==='F'?' fl':'');el.id='r_'+k;\n el.onclick=()=>info(k);\n let bits='',ix='';\n if(k==='F'){\n  const L=[['S',7],['Z',6,],['X',5],['AC',4],['X',3],['P',2],['X',1],['CY',0]];\n  bits=L.map(x=>`<span class=\"bit ${x[0]==='X'?'x':'f'}\" id=\"fb_${x[1]}\">${x[0]}<\/span>`).join('');\n  ix=L.map(x=>`<i style=\"width:30px\">D${x[1]}<\/i>`).join('');\n  el.innerHTML=`<div class=\"nm\">${r.n}<span>8-bit<\/span><\/div><div class=\"ix\">${ix}<\/div><div class=\"bits\">${bits}<\/div><div class=\"bits\" id=\"fv\"><\/div><div class=\"hx\" id=\"h_F\"><\/div>`;\n }else{\n  for(let i=r.b-1;i>=0;i--){const gp=(r.b===16&&i===7)?' gap':'';ix+=`<i class=\"${gp}\">${i}<\/i>`;bits+=`<span class=\"bit${gp}\" id=\"b_${k}_${i}\">0<\/span>`;}\n  el.innerHTML=`<div class=\"nm\">${r.n}<span>${r.b}-bit<\/span><\/div><div class=\"ix\">${ix}<\/div><div class=\"bits\">${bits}<\/div><div class=\"hx\" id=\"h_${k}\"><\/div>`;\n }\n return el;\n}\nfunction build(){\n document.getElementById('g1').appendChild(mk('A'));\n const g2=document.getElementById('g2');\n [['B','C','BC'],['D','E','DE'],['H','L','HL']].forEach(p=>{\n  const d=document.createElement('div');d.className='pair';d.innerHTML=`<small>${p[2]} pair = 16-bit<\/small>`;\n  d.appendChild(mk(p[0]));d.appendChild(mk(p[1]));g2.appendChild(d);});\n ['F'].forEach(k=>document.getElementById('g3').appendChild(mk(k)));\n ['PC','SP'].forEach(k=>document.getElementById('g4').appendChild(mk(k)));\n ['IR','W','Z','TMP'].forEach(k=>document.getElementById('g5').appendChild(mk(k)));\n const rows=[['S','D7','Sign','MSB (bit 7) of the result is 1 (negative number)'],['Z','D6','Zero','Result of the operation is 0'],\n  ['X','D5','Not used','\\u2013'],['AC','D4','Auxiliary Carry','Carry from bit 3 to bit 4 (used for BCD, DAA)'],['X','D3','Not used','\\u2013'],\n  ['P','D2','Parity','Result has an even number of 1s'],['X','D1','Not used','\\u2013'],['CY','D0','Carry','Carry (or borrow) out of bit 7']];\n const t=document.getElementById('ft');\n rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td><b>${r[0]}<\/b><\/td><td>${r[1]}<\/td><td>${r[2]}<\/td><td style=\"text-align:left\">${r[3]}<\/td><td class=\"v\" id=\"fv_${r[0]}\">${r[0]==='X'?'\\u2013':'0'}<\/td>`;if(r[0]!=='X')tr.id='frow_'+r[0];t.appendChild(tr);});\n const sel=document.getElementById('ins');Object.keys(INS).forEach(k=>{const o=document.createElement('option');o.textContent=k;sel.appendChild(o);});\n refresh();\n}\nfunction refresh(){\n Object.keys(R).forEach(k=>{const v=val(k),b=R[k].b;\n  if(k==='F'){const m={7:'S',6:'Z',4:'AC',2:'P',0:'CY'};\n   [7,6,4,2,0].forEach(i=>document.getElementById('fb_'+i).classList.toggle('on',!!S.fl[m[i]]));\n   document.getElementById('fv').innerHTML=[7,6,5,4,3,2,1,0].map(i=>`<span class=\"bit\" style=\"width:30px\">${m[i]?S.fl[m[i]]:'X'}<\/span>`).join('');}\n  else for(let i=0;i<b;i++)document.getElementById(`b_${k}_${i}`).className='bit'+(v>>i&1?' on':'')+((b===16&&i===7)?' gap':'');\n  document.getElementById('h_'+k).textContent=k==='F'?'F = '+hx(v,8):hx(v,b);});\n ['S','Z','AC','P','CY'].forEach(f=>document.getElementById('fv_'+f).textContent=S.fl[f]);\n}\nfunction info(k){const r=R[k];\n const cat={acc:'Accumulator',gp:'General purpose',flg:'Flag register',sp:'Special purpose',in:'Internal / temporary'}[r.c];\n document.getElementById('info').innerHTML=`<b>${r.n}<\/b> \\u2013 <b>${r.b}-bit<\/b> register (stores values 0 to ${r.b===8?255:65535}, i.e. ${r.b===8?'00H\\u2013FFH':'0000H\\u2013FFFFH'}). Category: <b>${cat}<\/b>. ${r.d}`;\n hl([k]);}\nfunction hl(ids){document.querySelectorAll('.reg').forEach(e=>e.classList.remove('hl'));ids.forEach(k=>{const e=document.getElementById('r_'+k);if(e)e.classList.add('hl');});}\n\n/* ---------- instruction demo ---------- */\nconst par=v=>{let c=0;for(let i=0;i<8;i++)c+=v>>i&1;return c%2===0?1:0;};\nfunction sf(res,cy,ac){S.fl.S=res>>7&1;S.fl.Z=res===0?1:0;S.fl.P=par(res);S.fl.AC=ac?1:0;S.fl.CY=cy?1:0;}\nconst INS={\n 'MVI A,data':{op:0x3E,len:2,src:[],dst:['A'],t:'Data is loaded directly into A.',f:0,run:d=>{S.A=d&255;}},\n 'MVI B,data':{op:0x06,len:2,src:[],dst:['B'],t:'Data is loaded directly into B.',f:0,run:d=>{S.B=d&255;}},\n 'MOV B,A':{op:0x47,len:1,src:['A'],dst:['B'],t:'Contents of A are copied into B.',f:0,run:()=>{S.B=S.A;}},\n 'ADD B':{op:0x80,len:1,src:['A','B'],dst:['A'],t:'A + B is calculated in the ALU; result goes to A.',f:1,run:()=>{const r=S.A+S.B;sf(r&255,r>255,(S.A&15)+(S.B&15)>15);S.A=r&255;}},\n 'SUB B':{op:0x90,len:1,src:['A','B'],dst:['A'],t:'A \\u2212 B is calculated in the ALU; result goes to A. CY = 1 means borrow.',f:1,run:()=>{const r=(S.A-S.B)&255;sf(r,S.A<S.B,(S.A&15)+((~S.B)&15)+1>15);S.A=r;}},\n 'ANA B':{op:0xA0,len:1,src:['A','B'],dst:['A'],t:'A AND B; CY is reset to 0 and AC is set to 1.',f:1,run:()=>{S.A&=S.B;sf(S.A,0,1);}},\n 'XRA A':{op:0xAF,len:1,src:['A'],dst:['A'],t:'A XOR A clears the accumulator: Z and P become 1.',f:1,run:()=>{S.A=0;sf(0,0,0);}},\n 'INR A':{op:0x3C,len:1,src:['A'],dst:['A'],t:'A is incremented; all flags except CY are updated.',f:1,run:()=>{const c=S.fl.CY,ac=(S.A&15)+1>15;S.A=(S.A+1)&255;sf(S.A,c,ac);}},\n 'DCR A':{op:0x3D,len:1,src:['A'],dst:['A'],t:'A is decremented; all flags except CY are updated.',f:1,run:()=>{const c=S.fl.CY,ac=(S.A&15)>0;S.A=(S.A-1)&255;sf(S.A,c,ac);}},\n 'CMA':{op:0x2F,len:1,src:['A'],dst:['A'],t:'A is complemented (1s complement). No flags change.',f:0,run:()=>{S.A=(~S.A)&255;}},\n 'INX H':{op:0x23,len:1,src:['H','L'],dst:['H','L'],t:'The 16-bit pair HL is incremented. No flags change.',f:0,run:()=>{const v=((S.H<<8|S.L)+1)&65535;S.H=v>>8;S.L=v&255;}},\n 'LXI H,data16':{op:0x21,len:3,src:[],dst:['H','L'],t:'A 16-bit value is loaded into H (high byte) and L (low byte).',f:0,run:d=>{S.H=(d>>8)&255;S.L=d&255;}}\n};\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));let busy=false;\nfunction msg(s){document.getElementById('msg').innerHTML=s;}\nasync function run(){\n if(busy)return;busy=true;\n const k=document.getElementById('ins').value,I=INS[k],d=parseInt(document.getElementById('dat').value,16)||0;\n msg('<b>Step 1 \\u2013 Fetch:<\/b> the opcode '+hx(I.op,8)+' of <b>'+k+'<\/b> is read from memory at PC = '+hx(S.PC,16)+' and stored in the Instruction Register (IR).');\n hl(['PC']);await sleep(1100);S.IR=I.op;S.PC=(S.PC+1)&65535;refresh();hl(['IR','PC']);await sleep(1300);\n if(I.len>1){msg('<b>Step 2 \\u2013 Operand fetch:<\/b> the '+(I.len-1)+' operand byte(s) are read; PC moves to '+hx((S.PC+I.len-1)&65535,16)+'.');\n  S.W=(d>>8)&255;S.Z=d&255;S.PC=(S.PC+I.len-1)&65535;refresh();hl(I.len===3?['W','Z','PC']:['Z','PC']);await sleep(1500);}\n msg('<b>Step '+(I.len>1?3:2)+' \\u2013 Execute:<\/b> '+I.t);\n hl(I.src.concat(['TMP']));S.TMP=I.src.length>1?S.B:S.TMP;refresh();await sleep(1200);\n const old=JSON.stringify(S.fl);I.run(d);refresh();hl(I.dst);await sleep(1300);\n if(I.f){hl(['F']);msg('<b>Last step \\u2013 Flags updated:<\/b> S='+S.fl.S+', Z='+S.fl.Z+', AC='+S.fl.AC+', P='+S.fl.P+', CY='+S.fl.CY+'.');\n  ['S','Z','AC','P','CY'].forEach(f=>{const e=document.getElementById('frow_'+f);e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');});\n  document.querySelectorAll('.fl .bit.f').forEach(e=>{e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');});\n  await sleep(1800);}\n else msg('<b>Done:<\/b> '+k+' does not affect any flag.');\n hl([]);busy=false;\n}\nfunction resetAll(){Object.assign(S,{A:0,B:0,C:0,D:0,E:0,H:0,L:0,PC:0x2000,SP:0x2FFF,IR:0,W:0,Z:0,TMP:0,fl:{S:0,Z:0,AC:0,P:0,CY:0}});refresh();hl([]);msg('Registers reset. Try MVI A,data then ADD B or INR A and watch the flags.');}\nbuild();msg('Choose an instruction and press Execute. Tip: MVI A,FF then INR A sets Z and AC; MVI A,80 then ADD B with B=80 sets CY.');\n<\/script><\/body><\/html>\n", "timing": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>8085 Timing Diagram - MVI r,data<\/title>\n<style>\n  body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:14px;text-align:center;color:#222}\n  h2{margin:6px 0}\n  canvas{background:#fff;border:2px solid #345;border-radius:8px;display:block;margin:8px auto;max-width:100%}\n  .panel{display:inline-block;vertical-align:top;background:#fff;border:1px solid #bbb;border-radius:8px;padding:10px 14px;margin:6px;text-align:left;font-size:14px}\n  .panel label{margin:0 8px 0 0;white-space:nowrap}\n  button{padding:7px 12px;margin:3px 2px;border:0;border-radius:5px;background:#2a6fdb;color:#fff;cursor:pointer;font-size:14px}\n  button.alt{background:#6c7a89}\n  input[type=text]{width:52px;font-family:monospace;text-transform:uppercase}\n  table{border-collapse:collapse;font-family:monospace;font-size:13px;margin-top:4px}\n  td,th{border:1px solid #ccc;padding:3px 8px;text-align:center}\n  th{background:#eef2f7}\n  .hl{background:#fff3b0}\n  #explain{max-width:1040px;margin:6px auto;text-align:left;background:#fffbe6;border:1px solid #e6d98a;border-radius:8px;padding:10px 16px;font-size:15px;line-height:1.5;min-height:48px}\n<\/style>\n<\/head>\n<body>\n<h2>8085 Timing Diagram: MVI r,data (Interactive)<\/h2>\n\n<div class=\"panel\">\n  <label>Instruction:\n    <select id=\"reg\">\n      <option value=\"A\" selected>MVI A,data<\/option><option value=\"B\">MVI B,data<\/option>\n      <option value=\"C\">MVI C,data<\/option><option value=\"D\">MVI D,data<\/option>\n      <option value=\"E\">MVI E,data<\/option><option value=\"H\">MVI H,data<\/option>\n      <option value=\"L\">MVI L,data<\/option><option value=\"M\">MVI M,data (memory write)<\/option>\n    <\/select><\/label><br>\n  <label>Data (hex): <input type=\"text\" id=\"dat\" value=\"08\" maxlength=\"2\"><\/label>\n  <label>Start address (hex): <input type=\"text\" id=\"adr\" value=\"1000\" maxlength=\"4\"><\/label><br>\n  <label>HL (for MVI M): <input type=\"text\" id=\"hl\" value=\"2000\" maxlength=\"4\"><\/label>\n  <label>Clock (MHz): <input type=\"text\" id=\"frq\" value=\"3\" maxlength=\"5\"><\/label>\n  <div id=\"ititle\" style=\"margin-top:6px;font-weight:bold;color:#1a4fa0\"><\/div>\n<\/div>\n\n<div class=\"panel\">\n  <button id=\"play\" onclick=\"togglePlay()\">Pause<\/button>\n  <button class=\"alt\" onclick=\"restart()\">Restart<\/button>\n  <button class=\"alt\" onclick=\"stepT(-1)\">&#9664; T-state<\/button>\n  <button class=\"alt\" onclick=\"stepT(1)\">T-state &#9654;<\/button><br>\n  <label>Speed: <input type=\"range\" id=\"spd\" min=\"0.2\" max=\"3\" step=\"0.1\" value=\"0.8\"><\/label>\n  <label><input type=\"checkbox\" id=\"loop\" checked> Loop<\/label>\n<\/div>\n\n<canvas id=\"cv\" width=\"1100\" height=\"560\"><\/canvas>\n<div id=\"explain\"><\/div>\n\n<div class=\"panel\"><b>Live signal values<\/b><div id=\"live\"><\/div><\/div>\n<div class=\"panel\"><b>Memory and register<\/b><div id=\"mem\"><\/div><\/div>\n\n<script>\nconst cv=document.getElementById('cv'),g=cv.getContext('2d');\nconst L=130,TW=95,ROW0=100,RH=46,H=cv.height;\nconst OPC={A:0x3E,B:0x06,C:0x0E,D:0x16,E:0x1E,H:0x26,L:0x2E,M:0x36};\nconst hex2=v=>(v&255).toString(16).toUpperCase().padStart(2,'0')+'H';\nconst hex4=v=>(v&65535).toString(16).toUpperCase().padStart(4,'0')+'H';\nconst X=t=>L+t*TW;\nconst ROWS=[\n {k:'CLK',pre:'CLK',bar:''},{k:'AH',pre:'A15\\u2013A8',bar:''},{k:'AD',pre:'AD7\\u2013AD0',bar:''},\n {k:'ALE',pre:'ALE',bar:''},{k:'IOM',pre:'IO/',bar:'M'},{k:'S1',pre:'S1',bar:''},{k:'S0',pre:'S0',bar:''},\n {k:'RD',pre:'',bar:'RD'},{k:'WR',pre:'',bar:'WR'}];\nconst COL={CLK:'#333',ALE:'#d35400',IOM:'#555',S1:'#8e44ad',S0:'#8e44ad',RD:'#1a7f37',WR:'#c0392b'};\n\nlet cyc=[],total=0,sig={},busH=[],busAD=[],Tns=333.33,tcur=0,playing=true,hold=0;\nlet reg='A',opc=0x3E,dataB=8,start=0x1000,hl=0x2000,freq=3;\n\n/* ---------- build the timing model ---------- */\nfunction build(){\n  reg=document.getElementById('reg').value;\n  dataB=(parseInt(document.getElementById('dat').value,16)||0)&255;\n  start=(parseInt(document.getElementById('adr').value,16)||0)&65535;\n  hl=(parseInt(document.getElementById('hl').value,16)||0)&65535;\n  freq=parseFloat(document.getElementById('frq').value)||3;if(freq<=0)freq=3;\n  Tns=1000/freq;opc=OPC[reg];\n  cyc=[\n   {name:'M1: Opcode Fetch',type:'fetch',n:4,addr:start,data:opc,s1:1,s0:1},\n   {name:'M2: Memory Read (operand)',type:'read',n:3,addr:(start+1)&65535,data:dataB,s1:1,s0:0}];\n  if(reg==='M')cyc.push({name:'M3: Memory Write',type:'write',n:3,addr:hl,data:dataB,s1:0,s0:1});\n  let c=0;cyc.forEach(m=>{m.c0=c;c+=m.n;});total=c;\n  const lv=(k,t)=>{\n    const m=cyc.find(m=>t>=m.c0&&t<m.c0+m.n),lt=t-m.c0;\n    switch(k){\n      case 'CLK':return (t%1)<0.5?1:0;\n      case 'ALE':return lt<1?1:0;\n      case 'IOM':return 0;\n      case 'S1':return m.s1;\n      case 'S0':return m.s0;\n      case 'RD':return (m.type!=='write'&&lt>=1&&lt<3)?0:1;\n      case 'WR':return (m.type==='write'&&lt>=1&&lt<3)?0:1;}};\n  ['CLK','ALE','IOM','S1','S0','RD','WR'].forEach(k=>{\n    const arr=[];\n    for(let h=0;h<total*2;h++){const l=lv(k,h/2+0.25);\n      if(arr.length&&arr[arr.length-1].l===l)arr[arr.length-1].b=(h+1)/2;\n      else arr.push({a:h/2,b:(h+1)/2,l});}\n    sig[k]=arr;});\n  busH=[];busAD=[];\n  cyc.forEach(m=>{\n    busH.push({a:m.c0,b:m.c0+3,kind:'addr',label:hex2(m.addr>>8),val:m.addr>>8});\n    if(m.type==='fetch')busH.push({a:m.c0+3,b:m.c0+4,kind:'none',label:'X'});\n    busAD.push({a:m.c0,b:m.c0+1,kind:'addr',label:hex2(m.addr&255),val:m.addr&255});\n    busAD.push({a:m.c0+1,b:m.c0+3,kind:m.type==='write'?'wdata':'rdata',\n      label:hex2(m.data)+(m.type==='fetch'?' (opcode)':''),val:m.data});\n    if(m.type==='fetch')busAD.push({a:m.c0+3,b:m.c0+4,kind:'hiz',label:'Hi-Z'});\n  });\n  document.getElementById('ititle').textContent='MVI '+reg+','+hex2(dataB)+'  |  opcode '+hex2(opc)+'  |  '+\n   cyc.length+' machine cycles, '+total+' T-states  |  T = '+Tns.toFixed(2)+' ns, total = '+(total*Tns/1000).toFixed(2)+' \\u00B5s';\n  tcur=0;hold=0;\n}\n\n/* ---------- drawing ---------- */\nfunction drawLabel(r,y){\n  g.font='bold 14px Arial';g.fillStyle='#111';g.textAlign='left';\n  const w1=g.measureText(r.pre).width,w2=g.measureText(r.bar).width;\n  g.fillText(r.pre,12,y);g.fillText(r.bar,12+w1,y);\n  if(r.bar){g.strokeStyle='#111';g.lineWidth=1.5;g.beginPath();g.moveTo(12+w1,y-14);g.lineTo(12+w1+w2,y-14);g.stroke();}\n}\nfunction digital(k,y0){\n  const yH=y0+10,yL=y0+36;g.strokeStyle=COL[k];g.lineWidth=2.5;g.beginPath();\n  let py=null;\n  sig[k].forEach((s,i)=>{const y=s.l?yH:yL;\n    if(i===0)g.moveTo(X(s.a),y);else{g.lineTo(X(s.a),py);g.lineTo(X(s.a),y);}\n    g.lineTo(X(s.b),y);py=y;});\n  g.stroke();\n}\nfunction bus(list,y0){\n  const yt=y0+8,yb=y0+38,ym=y0+23,s=7;\n  list.forEach(sg=>{\n    const x1=X(sg.a),x2=X(sg.b);\n    if(sg.kind==='hiz'||sg.kind==='none'){\n      g.strokeStyle='#888';g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.moveTo(x1,ym);g.lineTo(x2,ym);g.stroke();g.setLineDash([]);\n      g.fillStyle='#777';g.font='12px Arial';g.textAlign='center';g.fillText(sg.label,(x1+x2)/2,ym-5);return;}\n    const col=sg.kind==='addr'?'#1f5fbf':sg.kind==='rdata'?'#1a7f37':'#8e44ad';\n    const fill=sg.kind==='addr'?'#dce9fb':sg.kind==='rdata'?'#d9f2e0':'#eddcf5';\n    g.beginPath();g.moveTo(x1+s,yt);g.lineTo(x2-s,yt);g.lineTo(x2,ym);g.lineTo(x2-s,yb);g.lineTo(x1+s,yb);g.lineTo(x1,ym);g.closePath();\n    g.fillStyle=fill;g.fill();g.strokeStyle=col;g.lineWidth=2;g.stroke();\n    g.fillStyle=col;g.font='bold 14px Arial';g.textAlign='center';g.fillText(sg.label,(x1+x2)/2,ym+5);\n  });\n}\nfunction drawWaves(){\n  ROWS.forEach((r,i)=>{const y0=ROW0+i*RH;\n    if(r.k==='AH')bus(busH,y0);else if(r.k==='AD')bus(busAD,y0);else digital(r.k,y0);});\n}\nfunction curT(){return Math.max(0,Math.min(total-1,Math.ceil(tcur-1e-9)-1));}\nfunction drawAll(){\n  g.clearRect(0,0,cv.width,H);\n  const cur=curT(),gridH=ROWS.length*RH;\n  g.fillStyle='#fff6c9';g.fillRect(X(cur),ROW0-6,TW,gridH+6);\n  for(let k=0;k<=total;k++){g.strokeStyle='#ddd';g.lineWidth=1;g.setLineDash([3,4]);\n    g.beginPath();g.moveTo(X(k),ROW0-8);g.lineTo(X(k),ROW0+gridH);g.stroke();g.setLineDash([]);}\n  const cols=['#cfe3ff','#d4f1dc','#f1dcf5'];\n  cyc.forEach((m,i)=>{\n    g.fillStyle=cols[i];g.fillRect(X(m.c0)+2,10,m.n*TW-4,26);\n    g.strokeStyle='#567';g.lineWidth=1.5;g.strokeRect(X(m.c0)+2,10,m.n*TW-4,26);\n    g.fillStyle='#123';g.font='bold 13px Arial';g.textAlign='center';\n    g.fillText(m.name+' ('+m.n+'T)',X(m.c0)+m.n*TW/2,28);\n    for(let j=0;j<m.n;j++){g.fillStyle=(m.c0+j===cur)?'#c0392b':'#444';g.font='bold 14px Arial';\n      g.fillText('T'+(j+1),X(m.c0+j)+TW/2,62);}\n  });\n  g.font='11px Arial';g.fillStyle='#666';g.textAlign='center';\n  g.fillText('Machine cycle',60,28);g.fillText('T-state',60,62);\n  g.globalAlpha=0.22;drawWaves();g.globalAlpha=1;\n  g.save();g.beginPath();g.rect(0,ROW0-8,X(tcur),gridH+10);g.clip();drawWaves();g.restore();\n  ROWS.forEach((r,i)=>drawLabel(r,ROW0+i*RH+28));\n  const ya=ROW0+gridH+18;g.fillStyle='#444';g.font='11px Arial';g.textAlign='center';\n  g.fillText('time',60,ya);\n  for(let k=0;k<=total;k++)g.fillText((k*Tns).toFixed(0)+' ns',X(k),ya);\n  g.fillText('Clock '+freq+' MHz, T = '+Tns.toFixed(2)+' ns',X(total/2),ya+20);\n  g.strokeStyle='#e60000';g.lineWidth=2.5;g.beginPath();g.moveTo(X(tcur),ROW0-12);g.lineTo(X(tcur),ROW0+gridH);g.stroke();\n}\n\n/* ---------- panels ---------- */\nfunction valuesAt(t){\n  const tt=Math.min(Math.max(t,0),total-0.002),v={};\n  ['CLK','ALE','IOM','S1','S0','RD','WR'].forEach(k=>{const s=sig[k].find(s=>tt>=s.a&&tt<s.b);v[k]=s?s.l:'-';});\n  v.AH=busH.find(s=>tt>=s.a&&tt<s.b);v.AD=busAD.find(s=>tt>=s.a&&tt<s.b);return v;\n}\nfunction explain(m,lt){\n  const R=reg==='M'?'memory location M (HL)':'register '+reg, hi=hex2(m.addr>>8), lo=hex2(m.addr&255);\n  if(m.type==='fetch'){\n    if(lt===1)return '<b>M1-T1 (opcode fetch):<\/b> The Program Counter ('+hex4(m.addr)+') is placed on the address lines: A15\\u2013A8 = '+hi+', AD7\\u2013AD0 = '+lo+'. <b>ALE = 1<\/b> so the external latch (74LS373) stores the low address byte. IO/M\\u0305 = 0 (memory), S1 S0 = 1 1 (opcode fetch).';\n    if(lt===2)return '<b>M1-T2:<\/b> ALE falls to 0, the latch holds '+lo+'. <b>RD\\u0305 goes low<\/b> (read). Memory puts the opcode <b>'+hex2(opc)+'<\/b> on AD7\\u2013AD0. The PC is incremented to '+hex4(m.addr+1)+'. WR\\u0305 stays high.';\n    if(lt===3)return '<b>M1-T3:<\/b> The opcode '+hex2(opc)+' on the data bus is read into the Instruction Register. RD\\u0305 returns high, ending the read.';\n    return '<b>M1-T4:<\/b> The opcode '+hex2(opc)+' is decoded as MVI '+reg+',data. It is a 2-byte instruction, so one more byte must be read. The buses are idle (AD7\\u2013AD0 = Hi-Z) and no control signal is active.';\n  }\n  if(m.type==='read'){\n    if(lt===1)return '<b>M2-T1 (memory read):<\/b> The PC now holds '+hex4(m.addr)+', the address of the data byte. A15\\u2013A8 = '+hi+', AD7\\u2013AD0 = '+lo+'. <b>ALE = 1<\/b> latches the low address. S1 S0 = 1 0 (memory read).';\n    if(lt===2)return '<b>M2-T2:<\/b> ALE = 0. <b>RD\\u0305 goes low<\/b>. Memory places the data byte <b>'+hex2(dataB)+'<\/b> on AD7\\u2013AD0.';\n    return '<b>M2-T3:<\/b> The data byte '+hex2(dataB)+' is read by the 8085. RD\\u0305 returns high. '+(reg==='M'?'The byte is held internally; the next cycle writes it to memory.':'It is loaded into '+R+': <b>'+reg+' \\u2190 '+hex2(dataB)+'<\/b>. The instruction is complete.');\n  }\n  if(lt===1)return '<b>M3-T1 (memory write):<\/b> The address in HL ('+hex4(m.addr)+') is placed on the bus: A15\\u2013A8 = '+hi+', AD7\\u2013AD0 = '+lo+'. <b>ALE = 1<\/b> latches the low address. S1 S0 = 0 1 (memory write).';\n  if(lt===2)return '<b>M3-T2:<\/b> ALE = 0. The 8085 now <b>drives the data '+hex2(dataB)+' onto AD7\\u2013AD0<\/b> and <b>WR\\u0305 goes low<\/b>. RD\\u0305 stays high.';\n  return '<b>M3-T3:<\/b> Memory stores '+hex2(dataB)+' at '+hex4(m.addr)+'. WR\\u0305 returns high. The instruction is complete.';\n}\nfunction updatePanels(){\n  const cur=curT(),m=cyc.find(m=>cur>=m.c0&&cur<m.c0+m.n),lt=cur-m.c0+1;\n  document.getElementById('explain').innerHTML=explain(m,lt);\n  const v=valuesAt(tcur-0.001);\n  const bits=s=>s&&s.val!==undefined?(s.val&255).toString(2).padStart(8,'0'):'--------';\n  const bv=s=>s&&s.val!==undefined?hex2(s.val):(s&&s.label==='Hi-Z'?'Hi-Z':'---');\n  document.getElementById('live').innerHTML='<table><tr><th>Signal<\/th><th>Value<\/th><\/tr>'+\n   '<tr><td>A15\\u2013A8<\/td><td>'+bv(v.AH)+' ('+bits(v.AH)+')<\/td><\/tr>'+\n   '<tr><td>AD7\\u2013AD0<\/td><td>'+bv(v.AD)+' ('+bits(v.AD)+')<\/td><\/tr>'+\n   '<tr><td>ALE<\/td><td>'+v.ALE+'<\/td><\/tr>'+\n   '<tr><td>IO/M\\u0305<\/td><td>'+v.IOM+' (memory)<\/td><\/tr>'+\n   '<tr><td>S1 S0<\/td><td>'+v.S1+' '+v.S0+'<\/td><\/tr>'+\n   '<tr><td>RD\\u0305<\/td><td>'+v.RD+(v.RD===0?' (reading)':'')+'<\/td><\/tr>'+\n   '<tr><td>WR\\u0305<\/td><td>'+v.WR+(v.WR===0?' (writing)':'')+'<\/td><\/tr><\/table>';\n  const done=i=>tcur>=cyc[i].c0+cyc[i].n-1e-6;\n  const inM=i=>tcur>0&&cur>=cyc[i].c0&&cur<cyc[i].c0+cyc[i].n;\n  let h='<table><tr><th>Address<\/th><th>Content<\/th><th>Meaning<\/th><\/tr>';\n  h+='<tr class=\"'+(inM(0)?'hl':'')+'\"><td>'+hex4(start)+'<\/td><td>'+hex2(opc)+'<\/td><td>Opcode: MVI '+reg+'<\/td><\/tr>';\n  h+='<tr class=\"'+(inM(1)?'hl':'')+'\"><td>'+hex4(start+1)+'<\/td><td>'+hex2(dataB)+'<\/td><td>Data byte<\/td><\/tr>';\n  if(reg==='M')h+='<tr class=\"'+(inM(2)?'hl':'')+'\"><td>'+hex4(hl)+'<\/td><td>'+(done(2)?hex2(dataB):'??')+'<\/td><td>Memory M (HL)<\/td><\/tr>';\n  h+='<\/table>';\n  if(reg!=='M')h+='<div style=\"margin-top:8px;font-size:15px\"><b>Register '+reg+' = '+(done(1)?hex2(dataB):'??')+'<\/b><\/div>';\n  else h+='<div style=\"margin-top:8px;font-size:15px\"><b>M = '+(done(2)?hex2(dataB):'??')+'<\/b> (at '+hex4(hl)+')<\/div>';\n  document.getElementById('mem').innerHTML=h;\n}\n\n/* ---------- controls and loop ---------- */\nfunction togglePlay(){playing=!playing;if(playing&&tcur>=total)tcur=0;document.getElementById('play').textContent=playing?'Pause':'Play';}\nfunction restart(){tcur=0;hold=0;playing=true;document.getElementById('play').textContent='Pause';}\nfunction stepT(d){playing=false;document.getElementById('play').textContent='Play';\n  tcur=d>0?Math.min(total,Math.floor(tcur+1e-9)+1):Math.max(0,Math.ceil(tcur-1e-9)-1);}\n['reg','dat','adr','hl','frq'].forEach(id=>document.getElementById(id).onchange=build);\n\nlet last=performance.now();\nfunction frame(ts){\n  const dt=Math.min(0.05,(ts-last)/1000);last=ts;\n  if(playing){\n    if(tcur<total)tcur=Math.min(total,tcur+dt*parseFloat(document.getElementById('spd').value));\n    else if(document.getElementById('loop').checked){hold+=dt;if(hold>1.5){tcur=0;hold=0;}}\n  }\n  drawAll();updatePanels();\n  requestAnimationFrame(frame);\n}\nbuild();\nrequestAnimationFrame(frame);\n<\/script>\n<\/body>\n<\/html>"};
const TABS=[{"id": "programmer", "label": "8085 Programmer"}, {"id": "bus", "label": "Bus Architecture"}, {"id": "registers", "label": "Registers & Flags"}, {"id": "timing", "label": "Timing Diagram"}];
</script>
<script>
(function(){
  const nav=document.getElementById('nav'),stage=document.getElementById('stage'),frames={},btns={};
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.type='button';b.textContent=t.label;b.setAttribute('role','tab');b.setAttribute('aria-selected','false');
    b.onclick=()=>{show(t.id);history.replaceState(null,'','#'+t.id)};
    nav.appendChild(b);btns[t.id]=b;
  });
  function show(id){
    if(!SRC[id])id=TABS[0].id;
    if(!frames[id]){
      const f=document.createElement('iframe');
      f.title=TABS.find(t=>t.id===id).label;
      f.srcdoc=SRC[id];
      stage.appendChild(f);frames[id]=f;
    }
    TABS.forEach(t=>{
      if(frames[t.id])frames[t.id].hidden=t.id!==id;
      btns[t.id].setAttribute('aria-selected',String(t.id===id));
    });
    document.title=TABS.find(t=>t.id===id).label+' | 8085 Microprocessor Lab';
  }
  window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
