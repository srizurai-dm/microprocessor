<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jack and Jill</title>
<style>
body{margin:0;background:#e9f4ff;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;text-align:center}
svg{width:100%;max-width:900px;display:block;margin:6px auto;border:4px solid #7fb4e6;border-radius:18px;background:#cfe8ff}
#lyr{max-width:860px;margin:6px auto;background:#fff;border:4px solid #ffb703;border-radius:18px;padding:8px}
.ln{font-size:26px;color:#b8c2cc;margin:2px}.ln.cur{color:#444;font-size:34px}
.w{padding:0 3px;border-radius:8px}.w.on{background:#ffd54a;color:#d00000}
button{font:bold 24px "Comic Sans MS",sans-serif;padding:10px 26px;margin:4px;border:0;border-radius:40px;color:#fff;cursor:pointer;background:#ef476f}
button.b{background:#118ab2}label,select{font-size:15px}
</style></head><body>
<svg id="sv" viewBox="0 0 800 500">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec9f5"/><stop offset="1" stop-color="#eaf6ff"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#f4f9ff"/><stop offset="1" stop-color="#d7e6f7"/></linearGradient></defs>
<rect width="800" height="500" fill="url(#sk)"/><circle cx="90" cy="70" r="34" fill="#fff6c9"/>
<path d="M0 300 L90 190 L150 250 L240 130 L330 260 L420 170 L520 270 L620 150 L720 250 L800 190 L800 400 L0 400Z" fill="#9fb7d4"/>
<path d="M240 130 L215 165 L240 155 L262 168Z M620 150 L597 183 L620 174 L643 186Z M90 190 L68 218 L90 208 L110 220Z" fill="#fff"/>
<path d="M-60 520 C120 440 300 300 480 232 C540 210 600 208 660 222 C760 250 860 400 900 520Z" fill="url(#hl)" stroke="#c4d6ea" stroke-width="3"/>
<path d="M0 500 Q200 470 400 490 T800 480 V500Z" fill="#fff"/>
<g id="well">
 <rect x="548" y="150" width="8" height="70" fill="#7a4a21"/><rect x="604" y="150" width="8" height="70" fill="#7a4a21"/>
 <rect x="540" y="142" width="80" height="10" fill="#8b5a2b"/>
 <path d="M528 146 L580 112 L632 146Z" fill="#b7442b"/><path d="M528 146 L580 112 L632 146 Q580 128 528 146Z" fill="#fff"/>
 <ellipse cx="580" cy="218" rx="50" ry="13" fill="#3b3f46"/>
 <line id="rope" x1="580" y1="152" x2="580" y2="170" stroke="#c9a66b" stroke-width="3"/>
 <g id="bucket"><path d="M-14 0 L14 0 L11 22 L-11 22Z" fill="#8d5524" stroke="#5a3418"/><ellipse id="wat" cx="0" cy="2" rx="12" ry="3" fill="#4fc3f7" visibility="hidden"/><path d="M-12 0 Q0 -16 12 0" stroke="#555" fill="none" stroke-width="2"/></g>
 <path d="M530 214 H630 V242 Q580 252 530 242Z" fill="#a4acb8" stroke="#7b8594" stroke-width="2"/>
 <path d="M545 214 V242 M570 214 V246 M595 214 V246 M612 214 V242" stroke="#7b8594" stroke-width="1.5"/>
 <ellipse cx="580" cy="213" rx="50" ry="8" fill="#fff"/><ellipse cx="580" cy="215" rx="38" ry="5" fill="#3b3f46" opacity=".5"/>
</g>
<g id="jack"></g><g id="jill"></g><g id="hearts"></g><g id="flakes"></g>
<text id="title" x="400" y="62" text-anchor="middle" font-size="54" font-weight="bold" fill="#e63946" stroke="#fff" stroke-width="6" paint-order="stroke">Jack and Jill</text>
<text id="end" x="400" y="110" text-anchor="middle" font-size="60" font-weight="bold" fill="#7b2cbf" stroke="#fff" stroke-width="6" paint-order="stroke" visibility="hidden">The End</text>
</svg>
<div><button id="pb" onclick="toggle()">&#9654; Play</button><button class="b" onclick="restart()">&#8635; Again</button><br>
<label><input type="checkbox" id="mute"> Mute</label> &nbsp;<label>Voice: <select id="vs"></select></label></div>
<div id="lyr"></div>
<script>
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg';
const LINES=[{t:3,s:"Jack and Jill went up the hill"},{t:9.5,s:"To fetch a pail of water"},{t:16,s:"Jack fell down and broke his crown"},{t:22.5,s:"And Jill came tumbling after"}];
const END=33,P=[[90,425],[200,375],[320,310],[430,252],[500,232]];
const face='<circle r="15" fill="#e9bb8d"/><circle cx="-5" cy="-1" r="2.2" fill="#222"/><circle cx="5" cy="-1" r="2.2" fill="#222"/><circle cx="-5.7" cy="-1.9" r=".8" fill="#fff"/><circle cx="4.3" cy="-1.9" r=".8" fill="#fff"/><circle cx="-9" cy="5" r="3" fill="#f4968c" opacity=".6"/><circle cx="9" cy="5" r="3" fill="#f4968c" opacity=".6"/><path d="M-5 6 Q0 12 5 6" stroke="#b03a2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
const stars=id=>'<g id="'+id+'" visibility="hidden"><text x="-28" y="-112" font-size="16">&#11088;</text><text x="-4" y="-124" font-size="16">&#11088;</text><text x="14" y="-108" font-size="16">&#11088;</text></g>';
$('jill').innerHTML='<g id="jillB"><ellipse cx="-8" cy="-3" rx="7" ry="4" fill="#6b3b1e"/><ellipse cx="9" cy="-3" rx="7" ry="4" fill="#6b3b1e"/>'+
'<path d="M-24 -6 L24 -6 L15 -58 L-15 -58Z" fill="#d81e3a"/><path d="M-24 -6 L24 -6 L23 -15 L-23 -15Z" fill="#f4b400"/><path d="M-20 -30 H20" stroke="#f4b400" stroke-width="3"/>'+
'<path d="M-15 -58 L15 -58 L24 -28 L12 -20 L-2 -50Z" fill="#a50f2a"/><path d="M12 -58 L24 -28" stroke="#f4b400" stroke-width="3"/>'+
'<rect x="-23" y="-72" width="8" height="22" rx="4" fill="#e9bb8d"/><rect x="15" y="-72" width="8" height="22" rx="4" fill="#e9bb8d"/><rect x="-15" y="-74" width="30" height="18" rx="6" fill="#1b9e5a"/>'+
'<ellipse cx="-19" cy="-76" rx="5" ry="15" fill="#161616" transform="rotate(12 -19 -76)"/><ellipse cx="19" cy="-76" rx="5" ry="15" fill="#161616" transform="rotate(-12 19 -76)"/>'+
'<circle cx="-20" cy="-62" r="4" fill="#e63946"/><circle cx="20" cy="-62" r="4" fill="#e63946"/><circle cx="0" cy="-90" r="17" fill="#161616"/><g transform="translate(0,-88)">'+face+'</g>'+
'<path d="M-14 -96 Q0 -112 14 -96 Q0 -100 -14 -96Z" fill="#161616"/><circle cx="0" cy="-97" r="2.3" fill="#e0102a"/>'+stars('stJill')+'</g>';
$('jack').innerHTML='<g id="jackB"><ellipse cx="-8" cy="-3" rx="8" ry="4" fill="#5a3418"/><ellipse cx="8" cy="-3" rx="8" ry="4" fill="#5a3418"/>'+
'<rect x="-12" y="-40" width="10" height="36" rx="3" fill="#fff" stroke="#ccc"/><rect x="2" y="-40" width="10" height="36" rx="3" fill="#fff" stroke="#ccc"/>'+
'<rect x="-23" y="-72" width="8" height="22" rx="4" fill="#f4ead2"/><rect x="15" y="-72" width="8" height="22" rx="4" fill="#f4ead2"/>'+
'<path d="M-17 -76 L17 -76 L21 -30 L-21 -30Z" fill="#f6efdc" stroke="#ddd"/><path d="M-17 -76 L-3 -76 L-4 -36 L-20 -36Z M17 -76 L3 -76 L4 -36 L20 -36Z" fill="#223a6b"/>'+
'<circle cx="0" cy="-66" r="1.6" fill="#f4b400"/><circle cx="0" cy="-56" r="1.6" fill="#f4b400"/><circle cx="0" cy="-46" r="1.6" fill="#f4b400"/><path d="M12 -70 l4 3 M12 -60 l4 3" stroke="#aaa" stroke-width="1.5"/>'+
'<circle cx="0" cy="-90" r="16" fill="#161616"/><g transform="translate(0,-88)">'+face+'</g>'+
'<path d="M-16 -100 L-14 -120 L6 -124 L17 -100Z" fill="#f08a24"/><rect x="-16" y="-104" width="33" height="6" fill="#2a4aa8"/><path d="M-10 -112 l4 -5 l4 5 l-4 5z M2 -112 l4 -5 l4 5 l-4 5z" fill="#ffd60a"/>'+
'<g id="band" visibility="hidden"><rect x="-10" y="-106" width="22" height="8" rx="3" fill="#fff" stroke="#e63946" stroke-width="1.5" transform="rotate(-8)"/><path d="M-1 -104 v5 M-4 -101.5 h6" stroke="#e63946" stroke-width="1.5"/></g>'+stars('stJack')+'</g>';
const FL=[];for(let i=0;i<50;i++){const c=document.createElementNS(NS,'circle'),f={x:Math.random()*800,y:Math.random()*500,r:2+Math.random()*3,v:20+Math.random()*30,e:c};
 c.setAttribute('r',f.r);c.setAttribute('fill','#fff');c.setAttribute('stroke','#cfe3f7');$('flakes').appendChild(c);FL.push(f);}
const HT=[];for(let i=0;i<8;i++){const t=document.createElementNS(NS,'text');t.textContent='\u2764';t.setAttribute('font-size',26);t.setAttribute('fill','#ef476f');t.setAttribute('visibility','hidden');$('hearts').appendChild(t);HT.push(t);}
$('lyr').innerHTML=LINES.map((l,i)=>'<div class="ln" id="l'+i+'">'+l.s.split(' ').map(w=>'<span class="w">'+w+'</span>').join(' ')+'</div>').join('');

/* ---- voice ---- */
let voices=[];
function loadV(){if(!window.speechSynthesis)return;voices=speechSynthesis.getVoices();
 let l=voices.filter(v=>/en[-_]GB/i.test(v.lang));if(!l.length)l=voices.filter(v=>/^en/i.test(v.lang));
 $('vs').innerHTML=l.map(v=>'<option>'+v.name+'</option>').join('');
 const p=l.find(v=>/female|libby|sonia|serena|kate|hazel/i.test(v.name));if(p)$('vs').value=p.name;}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadV;loadV();}
function speak(s){if($('mute').checked||!window.speechSynthesis)return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(s);u.lang='en-GB';const v=voices.find(x=>x.name===$('vs').value);if(v)u.voice=v;u.pitch=1.9;u.rate=.8;speechSynthesis.speak(u);}

/* ---- animation ---- */
let T=0,playing=false,fired=[],last=performance.now();
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),E=t=>{t=cl(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
function pp(u){u=cl(u);const i=Math.min(3,Math.floor(u*4)),f=u*4-i;return[P[i][0]+(P[i+1][0]-P[i][0])*f,P[i][1]+(P[i+1][1]-P[i][1])*f];}
function put(id,u,rot,bob){const p=pp(u);$(id).setAttribute('transform','translate('+p[0]+' '+(p[1]-bob)+') rotate('+rot+' 0 -45)');}
function vis(id,b){$(id).setAttribute('visibility',b?'visible':'hidden');}
function toggle(){playing=!playing;$('pb').innerHTML=playing?'&#10074;&#10074; Pause':'&#9654; Play';
 if(window.speechSynthesis){playing?speechSynthesis.resume():speechSynthesis.pause();}
 if(playing&&T>=END)restart();}
function restart(){T=0;fired=[];if(window.speechSynthesis)speechSynthesis.cancel();playing=true;$('pb').innerHTML='&#10074;&#10074; Pause';}
function render(){
 const s=E((T-3.3)/5.7),walk=T>3.3&&T<9;
 let uJ=.86*s,uK=.14+.86*s,rJ=0,rK=0,rollJ=false,rollK=false;
 if(T>=16){const f=E((T-16.9)/3.4);uK=1-.6*f;rK=-720*f;rollK=f>0&&f<1;}
 if(T>=22.5){const f=E((T-23.4)/3.8);uJ=.86*(1-f);rJ=-720*f;rollJ=f>0&&f<1;}
 let b=Math.abs(Math.sin(T*3))*2;if(walk)b=Math.abs(Math.sin(T*9))*4;if(T>29)b=Math.abs(Math.sin(T*6))*9;
 put('jack',uK,rK,rollK?0:b);put('jill',uJ,rJ,rollJ?0:b);
 vis('stJack',T>16.9&&T<25);vis('stJill',T>23.4&&T<30);vis('band',T>19.5);
 // bucket on a rope
 let by=170;const t2=T-9.5;
 if(t2>0&&t2<6.5){by=t2<2?170+58*E(t2/2):t2<3.2?228:228-56*E((t2-3.2)/2.4);}
 $('bucket').setAttribute('transform','translate(580 '+by+')');
 $('rope').setAttribute('y2',by-8);vis('wat',t2>3.2||T>=16);
 // texts
 vis('title',T<3);vis('end',T>29.5);
 HT.forEach((h,i)=>{h.setAttribute('visibility',T>29?'visible':'hidden');h.setAttribute('x',110+i*85);h.setAttribute('y',340-(((T-29)*45+i*37)%230));});
 // lyrics
 LINES.forEach((l,i)=>{const cur=T>=l.t&&T<l.t+6.5,w=$('l'+i).children,k=Math.floor((T-l.t)/4.2*w.length)+1;
  $('l'+i).className='ln'+(cur?' cur':'');for(let j=0;j<w.length;j++)w[j].className='w'+(cur&&j<k?' on':'');
  if(playing&&T>=l.t&&!fired[i]){fired[i]=1;speak(l.s);}});
}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;
 if(playing){T+=dt;if(T>=END){T=END;playing=false;$('pb').innerHTML='&#9654; Play';}}
 FL.forEach(f=>{f.y+=f.v*dt;f.x+=Math.sin(f.y/40)*.3;if(f.y>500){f.y=-5;f.x=Math.random()*800;}f.e.setAttribute('cx',f.x);f.e.setAttribute('cy',f.y);});
 render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
